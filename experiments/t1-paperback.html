<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3EDE1" />
<title>T1 — Tonight In Paperback</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="vendor/dialkit/styles.css" />
<style>
  /* ---- T1 palette (from the spec — don't invent new colours) ---- */
  :root {
    --paper:  #F3EDE1;
    --ink:    #16130F;
    --band:   #E4551F;
    --braise: #6E2230;
    --soup:   #B8B08D;
    --cold:   #2E4A46;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    /* no shadows, no gradients, no radius over 2px */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
    overflow: hidden;
  }

  .cover {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }

  /* The Marber band: fixed top third, title always in the same place */
  .band {
    background: var(--band);
    height: 88px;
    margin: 0 -24px;
  }

  .title {
    margin-top: 40px;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.08;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .title .line { display: block; }

  .label {
    margin-top: auto;
    margin-bottom: 40px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 15px;
  }

  .accession {
    margin-bottom: 40px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* =====================================================================
     YOUR 30 MINUTES START HERE.
     Everything above is structure. Everything below is the argument.

     Spec to hit:
       - band slides down from the top    240ms cubic-bezier(.2,.8,.2,1)
       - title lines stagger              90ms apart
       - accession number stamps LAST     120ms ease-out
                                          scale(1.04) -> 1, rotate(-0.5deg)
                                          and it STAYS crooked
       - total ~900ms

     The .play class is added on tap. Animate from that.
     ===================================================================== */

  /* --- every value here is driven by the DialKit panel (top right) --- */
  :root {
    --line-travel: 32px;
    --line-dur:    760ms;
    --line-ease:   cubic-bezier(.33, 0, .2, 1);
    --gap:         70ms;
    --stamp-delay: 1000ms;
    --stamp-dur:   180ms;
    --stamp-ease:  cubic-bezier(.2, .9, .25, 1);
    --stamp-angle: -2deg;
  }

  .band {
    transform: translateY(-100%);
    transition: transform 240ms cubic-bezier(.2,.8,.2,1);
  }
  .title .line {
    opacity: 0;
    transform: translateY(var(--line-travel));
    transition: opacity   var(--line-dur) var(--line-ease),
                transform var(--line-dur) var(--line-ease);
  }
  .accession {
    opacity: 0;
    transform: scale(1.04) rotate(0deg);
    transition: opacity   var(--stamp-dur) var(--stamp-ease),
                transform var(--stamp-dur) var(--stamp-ease);
  }

  /* --- the reveal --- */
  .play .band { transform: translateY(0); }

  .play .line { opacity: 1; transform: translateY(0); }
  .play .line:nth-child(1) { transition-delay: 240ms; }
  .play .line:nth-child(2) { transition-delay: calc(240ms + var(--gap)); }
  .play .line:nth-child(3) { transition-delay: calc(240ms + var(--gap) * 2); }

  .play .accession {
    opacity: 1;
    transform: scale(1) rotate(var(--stamp-angle));
    transition-delay: var(--stamp-delay);
  }

  /* ===================== end of your 30 minutes ====================== */

  /* used for one frame to reset the reveal — see play() */
  .no-anim, .no-anim * { transition: none !important; animation: none !important; }

  /* The brief is a popover, hidden until asked for, so it can never sit on
     the composition. Its button parks itself beside the DialKit panel. */
  .brief-btn {
    position: fixed; top: 16px; right: 16px; z-index: 30;
    font: 600 10px/1 system-ui, sans-serif;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 8px 10px; cursor: pointer;
    color: inherit; background: rgba(128,128,128,.16);
    border: 1px solid currentColor; border-radius: 2px;
    opacity: .55;
  }
  .brief-btn:hover { opacity: 1; }
  .brief-btn[aria-pressed="true"] { opacity: 1; }

  .brief {
    position: fixed; top: 48px; right: 16px; z-index: 30;
    max-width: 230px;
    font: 10px/1.55 system-ui, sans-serif; text-align: left;
    padding: 12px 14px;
    background: rgba(128,128,128,.16);
    border: 1px solid currentColor;
    backdrop-filter: blur(12px);
    color: inherit;
  }
  .brief strong { display: block; margin-bottom: 6px; letter-spacing: .12em; text-transform: uppercase; }
  .brief em { display: block; margin-top: 8px; font-style: normal; opacity: .72; }
  .brief[hidden] { display: none; }

  .hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 10px; opacity: .35;
    letter-spacing: .1em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="cover" id="stage">
    <div class="band"></div>
    <h1 class="title">
      <span class="line">Minced beef</span>
      <span class="line">Soft carrot</span>
      <span class="line">The last of the milk</span>
    </h1>
    <p class="label">from the fridge of Danni Hu, 21 September</p>
    <p class="accession">No. 41 in the series</p>
  </div>
  <button class="brief-btn" type="button" aria-pressed="false">brief</button>
  <aside class="brief" hidden>
    <strong>Tonight In Paperback</strong>
    Dinner is a title in an infinite series; the format dignifies the mince.
    <em>feeling: being taken seriously<br />authority: an editor</em>
  </aside>
  <p class="hint">tap to replay</p>

<script src="vendor/dialkit/browser.global.js"></script>
<script>
  const stage = document.getElementById('stage');
  function play() {
    // A class toggle + reflow does NOT reset a transition that has a
    // transition-delay: the reverse transition is still sitting in its delay,
    // so nothing returns to the start state. Suppress transitions for a frame.
    stage.classList.add('no-anim');
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.remove('no-anim');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  const hint = document.querySelector('.hint');
  let taps = 0, resetTimer;
  function tap() {
    play();
    taps++;
    hint.textContent = 'replayed \u00d7' + taps;
    hint.style.opacity = '.75';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      hint.textContent = 'tap to replay';
      hint.style.opacity = '';
    }, 1400);
  }
  // pointerdown, not click: iOS Safari drops click on non-interactive elements
  // ---- the brief popover -------------------------------------------
  const brief = document.querySelector('.brief');
  const briefBtn = document.querySelector('.brief-btn');

  function toggleBrief(show) {
    brief.hidden = show === undefined ? !brief.hidden : !show;
    briefBtn.setAttribute('aria-pressed', String(!brief.hidden));
  }
  briefBtn.addEventListener('click', () => toggleBrief());
  addEventListener('keydown', e => {
    if (e.key === 'i' || e.key === 'I') toggleBrief();
  });

  // park the button and popover immediately left of the DialKit panel,
  // wherever that currently is
  function placeBrief() {
    const panel = document.querySelector('#dials .dialkit-panel');
    const r = panel && panel.offsetWidth ? panel.getBoundingClientRect() : null;
    const right = r ? Math.round(innerWidth - r.left + 8) : 16;
    briefBtn.style.right = right + 'px';
    brief.style.right = right + 'px';
  }
  addEventListener('resize', placeBrief);
  new MutationObserver(placeBrief).observe(document.getElementById('dials') || document.body,
    { childList: true, subtree: true, attributes: true });
  setTimeout(placeBrief, 0);
  document.body.addEventListener('pointerdown', e => {
    if (e.target.closest('#dials, .brief, .brief-btn')) return;   // panel clicks aren't replays
    tap();
  });
  play();

  // ---- live controls -------------------------------------------------
  const root = document.documentElement;
  const host = document.createElement('div');
  host.id = 'dials';
  document.body.appendChild(host);

  DialKit.createDialRoot({ target: host, position: 'top-right', defaultOpen: true });

  const kit = DialKit.createDialKit('T1 — the reveal', {
    'title':        { type: 'easing', duration: 760, ease: [.33, 0, .2, 1] },
    'line travel':  [32, 0, 80],
    'stagger':      [70, 0, 300],
    'stamp':        { type: 'easing', duration: 180, ease: [.2, .9, .25, 1] },
    'stamp delay':  [1000, 300, 1800],
    'stamp angle':  [-2, -8, 8],
  }, {
    id: 't1-reveal',
    persist: true,
    // hold the key and scroll, without moving the cursor off the thing you're watching
    shortcuts: { 'stagger': { key: 's' }, 'stamp angle': { key: 'a' } },
  });

  const bez = e => `cubic-bezier(${e.join(', ')})`;

  kit.subscribe(v => {
    root.style.setProperty('--line-dur',    v['title'].duration + 'ms');
    root.style.setProperty('--line-ease',   bez(v['title'].ease));
    root.style.setProperty('--line-travel', v['line travel'] + 'px');
    root.style.setProperty('--gap',         v['stagger'] + 'ms');
    root.style.setProperty('--stamp-dur',   v['stamp'].duration + 'ms');
    root.style.setProperty('--stamp-ease',  bez(v['stamp'].ease));
    root.style.setProperty('--stamp-delay', v['stamp delay'] + 'ms');
    root.style.setProperty('--stamp-angle', v['stamp angle'] + 'deg');
    play();   // every change replays so you see it immediately
  });
</script>
</body>
</html>
