<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E3A2F" />
<title>T2 — Cut The Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="vendor/dialkit/styles.css" />
<style>
  /* ---- T2 palette ---- */
  :root {
    --baize:    #1E3A2F;
    --bone:     #E9E2D0;
    --keyline:  #0B0D0C;
    --cinnabar: #B32B1E;
    --blue:     #2B4C9B;
    --ochre:    #D9A441;
    --gilt:     #C9A227;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--baize);
    font-family: 'Bodoni Moda', serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .table { perspective: var(--persp, 1400px); }

  .card {
    position: relative;
    width: 264px;
    height: 424px;
    transform-style: preserve-3d;
    /* the gilt edge — 2px only, never a fill, never a gradient */
    box-shadow: 0 0 0 2px var(--gilt);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  /* The back: a dense repeating lattice whose whole job is to withhold.
     Zero assets — pure repeating-linear-gradient. */
  .back {
    background-color: var(--cinnabar);
    background-image:
      repeating-linear-gradient( 45deg, var(--keyline) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(-45deg, var(--keyline) 0 1px, transparent 1px 9px);
  }

  .front {
    background: var(--bone);
    color: var(--keyline);
    transform: rotateY(180deg);
  }

  /* the crude four-ink stencil mark above the name */
  .mark {
    width: 44px; height: 44px;
    margin-bottom: 28px;
    background:
      linear-gradient(var(--ochre) 0 0) 0 0 / 100% 50% no-repeat,
      linear-gradient(var(--blue)  0 0) 0 100% / 100% 50% no-repeat;
    box-shadow: 0 0 0 1.5px var(--keyline);
  }

  .name {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.5;
  }

  .suit {
    margin-top: 28px;
    font-style: italic;
    font-size: 14px;
    text-align: center;
    opacity: .75;
  }

  /* =====================================================================
     YOUR 30 MINUTES START HERE.

     Spec to hit:
       - the card turns on its VERTICAL axis
             rotateY 420ms cubic-bezier(.45,0,.15,1)
             with a 3deg overshoot, then 60ms settle
       - the gilt edge catches a 200ms light sweep as it passes 90deg
       - total ~480ms. Ceremonial, not fast.

     The .play class is added on tap. Card starts face-DOWN.
     ===================================================================== */

  /* --- driven by the DialKit panel --- */
  :root {
    --turn-dur:  480ms;
    --turn-ease: cubic-bezier(.45, 0, .15, 1);
    --overshoot: 3deg;
    --persp:     1400px;
  }

  /* resting: face down. The back is unrotated, the front sits at 180deg,
     so rotateY(0) shows you the back and rotateY(180) shows the face. */
  .card { transform: rotateY(0deg); }

  .play .card {
    animation: turn var(--turn-dur) var(--turn-ease) forwards;
  }

  /* turn, then a short settle back from the overshoot */
  @keyframes turn {
    0%   { transform: rotateY(0deg); }
    88%  { transform: rotateY(calc(180deg + var(--overshoot))); }
    100% { transform: rotateY(180deg); }
  }

  /* the light sweep across the gilt edge at 90deg — optional, do it last */
  .card::after { /* TODO */ }

  /* ===================== end of your 30 minutes ====================== */

  /* used for one frame to reset the reveal — see play() */
  .no-anim, .no-anim * { transition: none !important; animation: none !important; }

  /* The brief is a popover, hidden until asked for, so it can never sit on
     the composition. Its button parks itself beside the DialKit panel. */
  .brief-btn {
    position: fixed; top: 16px; right: 16px; z-index: 30;
    font: 600 10px/1 system-ui, sans-serif;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 8px 10px; cursor: pointer;
    color: inherit; background: rgba(128,128,128,.16);
    border: 1px solid currentColor; border-radius: 2px;
    opacity: .55;
  }
  .brief-btn:hover { opacity: 1; }
  .brief-btn[aria-pressed="true"] { opacity: 1; }

  .brief {
    position: fixed; top: 48px; right: 16px; z-index: 30;
    max-width: 230px;
    font: 10px/1.55 system-ui, sans-serif; text-align: left;
    padding: 12px 14px;
    background: rgba(128,128,128,.16);
    border: 1px solid currentColor;
    backdrop-filter: blur(12px);
    color: inherit;
  }
  .brief strong { display: block; margin-bottom: 6px; letter-spacing: .12em; text-transform: uppercase; }
  .brief em { display: block; margin-top: 8px; font-style: normal; opacity: .72; }
  .brief[hidden] { display: none; }

  .hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: var(--bone); opacity: .35;
    letter-spacing: .1em; text-transform: uppercase; font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="table" id="stage">
    <div class="card">
      <div class="face back"></div>
      <div class="face front">
        <div class="mark"></div>
        <p class="name">Minced beef<br />Soft carrot<br />The last of the milk</p>
        <p class="suit">beef &middot; milk &middot; the last carrot</p>
      </div>
    </div>
  </div>
  <button class="brief-btn" type="button" aria-pressed="false">brief</button>
  <aside class="brief" hidden>
    <strong>Cut The Deck</strong>
    You don't want a recommendation, you want fate.
    <em>feeling: absolution<br />authority: nobody — the deck</em>
  </aside>
  <p class="hint">tap to replay</p>

<script src="vendor/dialkit/browser.global.js"></script>
<script>
  const stage = document.getElementById('stage');
  function play() {
    // A class toggle + reflow does NOT reset a transition that has a
    // transition-delay: the reverse transition is still sitting in its delay,
    // so nothing returns to the start state. Suppress transitions for a frame.
    stage.classList.add('no-anim');
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.remove('no-anim');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  const hint = document.querySelector('.hint');
  let taps = 0, resetTimer;
  function tap() {
    play();
    taps++;
    hint.textContent = 'replayed \u00d7' + taps;
    hint.style.opacity = '.75';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      hint.textContent = 'tap to replay';
      hint.style.opacity = '';
    }, 1400);
  }
  // pointerdown, not click: iOS Safari drops click on non-interactive elements
  // ---- the brief popover -------------------------------------------
  const brief = document.querySelector('.brief');
  const briefBtn = document.querySelector('.brief-btn');

  function toggleBrief(show) {
    brief.hidden = show === undefined ? !brief.hidden : !show;
    briefBtn.setAttribute('aria-pressed', String(!brief.hidden));
  }
  briefBtn.addEventListener('click', () => toggleBrief());
  addEventListener('keydown', e => {
    if (e.key === 'i' || e.key === 'I') toggleBrief();
  });

  // park the button and popover immediately left of the DialKit panel,
  // wherever that currently is
  function placeBrief() {
    const panel = document.querySelector('#dials .dialkit-panel');
    const r = panel && panel.offsetWidth ? panel.getBoundingClientRect() : null;
    const right = r ? Math.round(innerWidth - r.left + 8) : 16;
    briefBtn.style.right = right + 'px';
    brief.style.right = right + 'px';
  }
  addEventListener('resize', placeBrief);
  new MutationObserver(placeBrief).observe(document.getElementById('dials') || document.body,
    { childList: true, subtree: true, attributes: true });
  setTimeout(placeBrief, 0);
  document.body.addEventListener('pointerdown', e => {
    if (e.target.closest('#dials, .brief, .brief-btn')) return;
    tap();
  });
  play();

  // ---- live controls -------------------------------------------------
  const root = document.documentElement;
  const host = document.createElement('div');
  host.id = 'dials';
  document.body.appendChild(host);
  DialKit.createDialRoot({ target: host, position: 'top-right', defaultOpen: true });

  const kit = DialKit.createDialKit('T2 — the turn', {
    'turn':        { type: 'easing', duration: 480, ease: [.45, 0, .15, 1] },
    'overshoot':   [3, 0, 14],
    'perspective': [1400, 400, 2600, 50],
  }, {
    id: 't2-turn',
    persist: true,
    shortcuts: { 'overshoot': { key: 'o' }, 'perspective': { key: 'p' } },
  });

  kit.subscribe(v => {
    root.style.setProperty('--turn-dur',  v['turn'].duration + 'ms');
    root.style.setProperty('--turn-ease', `cubic-bezier(${v['turn'].ease.join(', ')})`);
    root.style.setProperty('--overshoot', v['overshoot'] + 'deg');
    root.style.setProperty('--persp',     v['perspective'] + 'px');
    play();
  });
</script>
</body>
</html>
