<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B4B8F" />
<title>T3 — Enamel, Off-Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* ---- T3 palette ---- */
  :root {
    --enamel:  #1B4B8F;
    --cream:   #EFE7D2;
    --pillar:  #D22B1E;
    --yolk:    #F2B705;
    --keyline: #101418;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--enamel);
    font-family: 'Archivo Narrow', sans-serif;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    overflow: hidden;
  }

  /* the chip speckle — the one texture */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(var(--cream) 0.5px, transparent 0.5px);
    background-size: 7px 7px;
    opacity: .03;
  }

  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* left-locked, never centred. Oversized type breaks out of the frame. */
    padding-left: 16px;
    overflow: hidden;
  }

  /* Two stacked copies of the same heading.
     .plate = the cream colour layer, lands LATE and 1.5px off, never corrects.
     .key   = the black keyline layer, lands FIRST. */
  .headline { position: relative; }

  .headline h1 {
    font-family: 'Anton', sans-serif;
    font-size: 17vw;
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;   /* let it clip off the right edge — that's the point */
  }

  .headline .plate { color: var(--cream); }
  .headline .key   { color: var(--keyline); position: absolute; inset: 0; }

  .sub {
    margin-top: 24px;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* =====================================================================
     YOUR 30 MINUTES START HERE.

     Spec to hit:
       - .key (black keyline) lands FIRST
             180ms cubic-bezier(.34,1.56,.64,1)   <- overshoot
       - .plate (cream) follows 60ms LATER at translate(1.5px, -1.5px)
             and NEVER corrects. The offset is the signature.
       - 40ms 2px shake on land
       - total ~280ms. Fast. It does not perform for you.

     The .play class is added on tap.
     ===================================================================== */

  .headline .key   { /* TODO: starting state */ }
  .headline .plate { /* TODO: starting state */ }

  .play .key   { /* TODO */ }
  .play .plate { /* TODO */ }
  .play .sub   { /* TODO */ }

  /* ===================== end of your 30 minutes ====================== */

  .hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: var(--cream); opacity: .35;
    letter-spacing: .1em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="headline">
      <h1 class="plate">Minced beef<br />Soft carrot<br />The last milk</h1>
      <h1 class="key"  aria-hidden="true">Minced beef<br />Soft carrot<br />The last milk</h1>
    </div>
    <p class="sub">Another.</p>
  </div>
  <p class="hint">tap to replay</p>

<script>
  const stage = document.getElementById('stage');
  function play() {
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  document.body.addEventListener('click', play);
  play();
</script>
</body>
</html>
