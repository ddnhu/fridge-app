<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B4B8F" />
<title>T3 — Enamel, Off-Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../vendor/dialkit/styles.css" />
<style>
  /* ---- T3 palette ---- */
  :root {
    --enamel:  #1B4B8F;
    --cream:   #EFE7D2;
    --pillar:  #D22B1E;
    --yolk:    #F2B705;
    --keyline: #101418;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--enamel);
    font-family: 'Archivo Narrow', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    cursor: pointer;
    overflow: hidden;
  }

  /* the chip speckle — the one texture */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(var(--cream) 0.5px, transparent 0.5px);
    background-size: 7px 7px;
    opacity: .03;
  }

  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* left-locked, never centred. Oversized type breaks out of the frame. */
    padding-left: 16px;
    overflow: hidden;
  }

  /* Two stacked copies of the same heading.
     .plate = the cream colour layer, lands LATE and 1.5px off, never corrects.
     .key   = the black keyline layer, lands FIRST. */
  .headline { position: relative; }

  .headline h1 {
    font-family: 'Anton', sans-serif;
    font-size: 17vw;
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;   /* let it clip off the right edge — that's the point */
  }

  .headline .plate { color: var(--cream); }
  .headline .key   { color: var(--keyline); position: absolute; inset: 0; }

  .sub {
    margin-top: 24px;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* =====================================================================
     YOUR 30 MINUTES START HERE.

     Spec to hit:
       - .key (black keyline) lands FIRST
             180ms cubic-bezier(.34,1.73,.64,1)   <- overshoot
       - .plate (cream) follows 60ms LATER at translate(1.5px, -1.5px)
             and NEVER corrects. The offset is the signature.
       - 40ms 2px shake on land
       - total ~280ms. Fast. It does not perform for you.

     The .play class is added on tap.
     ===================================================================== */

  /* --- every value here is driven by the DialKit panel --- */
  :root {
    --drop:      18px;
    --land-dur:  180ms;
    --land-ease: cubic-bezier(.34, 1.73, .64, 1);
    --lag:       60ms;
    --off:       1.5px;
    --shake:     2px;
  }

  /* the keyline drops in and lands hard, with an overshoot */
  .headline .key {
    opacity: 0;
    transform: translateY(calc(var(--drop) * -1));
    transition: opacity 90ms linear,
                transform var(--land-dur) var(--land-ease);
  }

  /* the cream plate arrives LATE and lands off-register. It never corrects. */
  .headline .plate {
    opacity: 0;
    transform: translate(var(--off), calc(var(--off) * -1))
               translateY(calc(var(--drop) * -1));
    transition: opacity 90ms linear var(--lag),
                transform var(--land-dur) var(--land-ease) var(--lag);
  }

  .sub {
    opacity: 0;
    transition: opacity 120ms linear 200ms;
  }

  /* --- the reveal --- */
  .play .key {
    opacity: 1;
    transform: translateY(0);
    animation: shake 40ms linear var(--land-dur) 1;
  }

  .play .plate {
    opacity: 1;
    /* the misregistration survives. This is the signature, not a bug. */
    transform: translate(var(--off), calc(var(--off) * -1));
    animation: shake 40ms linear calc(var(--land-dur) + var(--lag)) 1;
  }

  .play .sub { opacity: 1; }

  @keyframes shake {
    0%   { margin-left: 0; }
    50%  { margin-left: var(--shake); }
    100% { margin-left: 0; }
  }

  /* ===================== end of your 30 minutes ====================== */

  /* used for one frame to reset the reveal — see play() */
  .no-anim, .no-anim * { transition: none !important; animation: none !important; }

  /* The brief, always in view while you tune — press I to hide it before
     you record. pointer-events:none so it never eats a tap. */
  .brief {
    position: fixed; top: 10px; left: 10px; max-width: 190px;
    font: 10px/1.55 system-ui, sans-serif; text-align: left;
    background: var(--enamel); padding: 8px 10px;
    color: var(--cream); opacity: .5; pointer-events: none; z-index: 10;
    letter-spacing: .02em;
  }
  .brief strong { display: block; margin-bottom: 4px; letter-spacing: .12em; text-transform: uppercase; }
  .brief em { display: block; margin-top: 6px; font-style: normal; opacity: .72; }
  .brief[hidden] { display: none; }

  .hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: var(--cream); opacity: .35;
    letter-spacing: .1em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="headline">
      <h1 class="plate">Minced beef<br />Soft carrot<br />The last milk</h1>
      <h1 class="key"  aria-hidden="true">Minced beef<br />Soft carrot<br />The last milk</h1>
    </div>
    <p class="sub">Another.</p>
  </div>
  <aside class="brief">
    <strong>Enamel, Off-Register</strong>
    A hot thing put in front of you by someone who has already decided.
    <em>feeling: being looked after, brusquely<br />authority: Andrew, or a grandmother</em>
  </aside>
  <p class="hint">tap to replay</p>

<script src="../vendor/dialkit/browser.global.js"></script>
<script>
  const stage = document.getElementById('stage');
  function play() {
    // A class toggle + reflow does NOT reset a transition that has a
    // transition-delay: the reverse transition is still sitting in its delay,
    // so nothing returns to the start state. Suppress transitions for a frame.
    stage.classList.add('no-anim');
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.remove('no-anim');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  const hint = document.querySelector('.hint');
  let taps = 0, resetTimer;
  function tap() {
    play();
    taps++;
    hint.textContent = 'replayed \u00d7' + taps;
    hint.style.opacity = '.75';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      hint.textContent = 'tap to replay';
      hint.style.opacity = '';
    }, 1400);
  }
  // pointerdown, not click: iOS Safari drops click on non-interactive elements
  // I hides the brief for recording
  addEventListener('keydown', e => {
    if (e.key === 'i' || e.key === 'I') {
      const b = document.querySelector('.brief');
      b.hidden = !b.hidden;
    }
  });
  document.body.addEventListener('pointerdown', e => {
    if (e.target.closest('#dials')) return;
    tap();
  });
  play();

  // ---- live controls -------------------------------------------------
  const root = document.documentElement;
  const host = document.createElement('div');
  host.id = 'dials';
  document.body.appendChild(host);
  DialKit.createDialRoot({ target: host, position: 'top-right', defaultOpen: true });

  const kit = DialKit.createDialKit('T3 — the reveal', {
    'landing':    { type: 'easing', duration: 180, ease: [.34, 1.73, .64, 1] },
    'off register': [1.5, 0, 6, 0.5],
    'plate lag':    [60, 0, 240],
    'drop':         [18, 0, 60],
    'shake':        [2, 0, 8],
  }, {
    id: 't3-reveal',
    persist: true,
    shortcuts: { 'off register': { key: 'o' }, 'plate lag': { key: 'l' } },
  });

  kit.subscribe(v => {
    root.style.setProperty('--land-dur',  v['landing'].duration + 'ms');
    root.style.setProperty('--land-ease', `cubic-bezier(${v['landing'].ease.join(', ')})`);
    root.style.setProperty('--off',       v['off register'] + 'px');
    root.style.setProperty('--lag',       v['plate lag'] + 'ms');
    root.style.setProperty('--drop',      v['drop'] + 'px');
    root.style.setProperty('--shake',     v['shake'] + 'px');
    play();
  });
</script>
</body>
</html>
